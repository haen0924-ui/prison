<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prison Escape · 감옥 탈출</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #1c1c28;
    color: #f2f2f2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 980px;
    background: #2a2a3a;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    text-align: center;
  }
  .icon { font-size: 64px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p.desc { color: #bbb; line-height: 1.6; margin-bottom: 20px; }
  .hidden { display: none !important; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
  }
  .timer { font-size: 16px; font-weight: bold; color: #ffd54f; }
  .timer.warn { color: #ef5350; animation: blink 0.6s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .bar {
    height: 8px;
    background: #444;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .bar-fill { height: 100%; background: #4caf50; width: 0%; transition: width 0.4s; }

  /* ===== 장면 화면 ===== */
  .scene-name { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
  .narr {
    background: #1f1f2b;
    border-left: 4px solid #ffb74d;
    border-radius: 8px;
    padding: 12px;
    text-align: left;
    line-height: 1.6;
    white-space: pre-line;
    min-height: 70px;
    margin-bottom: 12px;
    font-size: 15px;
  }
  .scene-box {
    position: relative;
    width: min(100%, calc(64vh * 0.75));
    margin: 0 auto;
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    border: 2px solid #111;
  }
  .scene-box svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlay { position: absolute; inset: 0; }
  .nobg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    color: #aaa; background: #1a1a22; font-size: 14px; line-height: 1.6;
  }
  .hs {
    position: absolute;
    padding: 2px 4px;
    font-size: 12px;
    line-height: 1.3;
    background: transparent;
    border: 2px dashed transparent;
    border-radius: 8px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 1px 3px #000;
    font-weight: bold;
  }
  .hs:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
  .hs:not(.exit) { z-index: 2; }
  .hs.exit { z-index: 1; }
  .hs.active {
    border-color: #ffb74d;
    background: rgba(255,183,77,0.08);
    animation: pulse 1.2s infinite;
  }
  .hs.done {
    border-color: #66bb6a;
    background: rgba(46,125,50,0.35);
  }
  .hs.exit.open {
    border-color: #90caf9;
    background: rgba(144,202,249,0.12);
  }
  .hs.locked {
    border-color: #777;
    background: rgba(0,0,0,0.4);
    color: #ccc;
  }
  .hs small { font-weight: normal; font-size: 10px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,183,77,0.7); }
    50% { box-shadow: 0 0 0 8px rgba(255,183,77,0); }
  }
  .hint { margin-top: 10px; font-size: 13px; color: #888; }

  /* ===== 문제 화면 ===== */
  .type-label {
    display: inline-block;
    background: #455a64;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .scene-text {
    font-size: 15px;
    color: #ffcc80;
    font-style: italic;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .question {
    font-size: 19px;
    line-height: 1.5;
    margin-bottom: 18px;
    min-height: 56px;
    white-space: pre-line;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .shake { animation: shake 0.4s; }

  button {
    font-family: inherit;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    background: #3d3d55;
    color: #fff;
    transition: background 0.2s, transform 0.1s, box-shadow 0.15s;
    width: 100%;
  }
  button:hover:not(:disabled) { background: #505072; }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { cursor: default; }

  .options { display: grid; gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid button { font-size: 32px; padding: 18px 0; }
  .ox-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ox-row button { font-size: 44px; padding: 22px 0; }
  #area .done { opacity: 0.45; }
  .glow { box-shadow: 0 0 0 4px #ffeb3b, 0 0 18px #ffeb3b; transform: scale(1.06); }
  .sel { outline: 3px solid #90caf9; }

  .match-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match-col { display: grid; gap: 10px; align-content: start; }
  .match-col button { min-height: 58px; font-size: 15px; padding: 10px 6px; white-space: pre-line; line-height: 1.4; }

  .input-row { display: flex; gap: 8px; margin-top: 6px; }
  .input-row input {
    flex: 1;
    font-size: 18px;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #555;
    background: #1f1f2b;
    color: #fff;
    text-align: center;
    font-family: inherit;
  }
  .input-row input:focus { outline: none; border-color: #90caf9; }
  .input-row button { width: auto; padding: 12px 18px; }

  .feedback { margin-top: 16px; min-height: 26px; font-weight: bold; }
  .feedback.ok { color: #81c784; }
  .feedback.no { color: #ef9a9a; }
  .next { margin-top: 12px; background: #1976d2; }
  .next:hover:not(:disabled) { background: #1e88e5; }

  /* ===== 연출 (쪽지 · 성에 · 빛) ===== */
  @keyframes slideUp {
    from { transform: translateY(80px) scale(0.92); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes sparkle {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,241,118,0.9); }
    50%      { box-shadow: 0 0 0 10px rgba(255,241,118,0); }
  }
  @keyframes beamIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes frostIn {
    from { opacity: 0; filter: blur(8px); }
    to   { opacity: 1; filter: none; }
  }
  .hs.sparkle {
    border-color: #fff176;
    background: rgba(255,241,118,0.12);
    animation: sparkle 1s infinite;
  }
  .beam {
    position: absolute;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,245,200,0.55), rgba(255,245,200,0) 85%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    animation: beamIn 1.5s ease-out;
  }
  #quiz-screen.paper {
    background: #f5edd6;
    color: #3b2a1a;
    border-radius: 6px;
    padding: 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    animation: slideUp 0.6s ease-out;
  }
  #quiz-screen.paper .question {
    font-family: "Malgun Gothic", "맑은 고딕", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 24px;
    color: #2b1d0e;
  }
  #quiz-screen.paper .type-label { background: #8d6e63; }
  #quiz-screen.paper .scene-text { color: #6d4c41; }
  #quiz-screen.paper .opt { background: #e6d8b4; color: #3b2a1a; }
  #quiz-screen.paper .opt:hover:not(:disabled) { background: #d9c79a; }
  #quiz-screen.paper .input-row input { background: #fffaf0; color: #3b2a1a; border-color: #a1887f; }
  #quiz-screen.paper .next { background: #6d4c41; }
  #quiz-screen.frost {
    background: linear-gradient(160deg, rgba(225,242,255,0.28), rgba(120,170,210,0.2));
    backdrop-filter: blur(4px);
    border: 1px solid rgba(225,245,255,0.55);
    box-shadow: inset 0 0 60px rgba(255,255,255,0.25), 0 8px 24px rgba(0,0,0,0.4);
    animation: frostIn 1s ease-out;
  }
  #quiz-screen.frost .question { color: #f0faff; text-shadow: 0 0 8px rgba(200,235,255,0.9); }
  #quiz-screen.frost .scene-text { color: #bfe3ff; }
  #quiz-screen.frost .opt { background: rgba(200,235,255,0.18); border: 1px solid rgba(225,245,255,0.5); }

  /* ===== 결과 ===== */
  .score-big { font-size: 40px; font-weight: bold; margin: 8px 0; }
  .grade { font-size: 40px; font-weight: bold; margin-bottom: 8px; }
  .result-msg { font-size: 20px; line-height: 1.6; margin-bottom: 20px; }
  .escaped { color: #81c784; }
  .jailed { color: #ef9a9a; }
  .restart { background: #6a1b9a; margin-top: 8px; }
  .restart:hover:not(:disabled) { background: #8e24aa; }














  .langs { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .langs button { width: auto; flex: 1; padding: 10px 6px; font-size: 15px; }
  .langs button.on { background: #1976d2; }

  /* ===== 결과 해설 ===== */
  .explain { text-align: left; margin: 8px 0 16px; }
  .exp-title { font-size: 20px; margin-bottom: 12px; text-align: center; }
  .exp-item { background: #1f1f2b; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .exp-num { font-weight: bold; color: #ffb74d; font-size: 13px; }
  .exp-q { font-size: 16px; line-height: 1.5; margin: 4px 0 6px; }
  .exp-ans { font-size: 15px; color: #81c784; font-weight: bold; margin-bottom: 6px; }
  .exp-text { font-size: 14px; line-height: 1.6; color: #ddd; }
  .exp-src { font-size: 12px; color: #888; margin-top: 6px; }
  .clue-hint { margin-top: 12px; color: #ffd27a; font-style: italic; }
  .exp-foot { font-size: 12px; color: #888; text-align: center; margin-top: 12px; line-height: 1.5; }

  /* ===== 태블릿 · 터치 조작 ===== */
  body { -webkit-user-select: none; user-select: none; touch-action: manipulation; overflow-x: hidden; }
  input { -webkit-user-select: text; user-select: text; }
  button { min-height: 52px; }
  .grid button { min-height: 96px; }
  .ox-row button { min-height: 130px; }
  .options button { min-height: 62px; }
  .match-col button { min-height: 72px; font-size: 17px; }
  .input-row input { min-height: 58px; font-size: 20px; }
  .input-row button { min-height: 58px; }
  .next, .restart, #start-btn { min-height: 56px; font-size: 18px; }
  .langs button { min-height: 52px; }
  #scene-box { width: min(100%, calc(72vh * 0.75)); margin: 0 auto; }

  @media (orientation: landscape) and (min-width: 760px) {
    .card { max-width: 1180px; }
    #scene-screen { display: grid; grid-template-columns: minmax(0, 1fr) calc((100vh - 170px) * 0.75); column-gap: 24px; row-gap: 12px; align-items: start; }
    #scene-screen > .top, #scene-screen > .bar { grid-column: 1 / -1; }
    #scene-screen > #scene-box { grid-column: 2; grid-row: 3 / span 3; width: min(100%, calc((100vh - 170px) * 0.75)); margin: 0; }
    #scene-screen > .scene-name, #scene-screen > .narr, #scene-screen > .hint { grid-column: 1; }
    #scene-screen > .scene-name { margin-bottom: 0; }
    #scene-screen > .narr { min-height: 160px; font-size: 17px; }
  }
</style>
</head>
<body>
<div class="card">

  <!-- 시작 화면 -->
  <div id="start-screen">
    <div class="icon">🔒</div>
    <h1 data-i18n="title"></h1>
    <p class="desc" data-i18n-html="desc"></p>
    <div class="langs">
      <button data-lang="ko">한국어</button>
      <button data-lang="en">English</button>
    </div>
    <button id="start-btn" data-i18n="start"></button>
  </div>

  <!-- 장면 화면 -->
  <div id="scene-screen" class="hidden">
    <div class="top"><span id="scene-progress"></span></div>
    <div class="bar"><div class="bar-fill" id="bar-scene"></div></div>
    <div class="scene-name" id="scene-name"></div>
    <div class="narr" id="scene-narr"></div>
    <div class="scene-box" id="scene-box">
      <div id="scene-art" style="position:absolute;inset:0;"></div>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="hint" data-i18n="hint"></div>
  </div>

  <!-- 문제 화면 -->
  <div id="quiz-screen" class="hidden">
    <div class="top">
      <span id="progress-text"></span>
      <span class="timer hidden" id="timer-text"></span>
    </div>
    <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="type-label" id="type-label"></div>
    <div class="scene-text" id="scene-text"></div>
    <div class="question" id="question-text"></div>
    <div id="area"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next hidden" id="next-btn" data-i18n="next"></button>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen" class="hidden">
    <div class="icon" id="result-icon"></div>
    <div class="score-big hidden" id="score-text"></div>
    <div class="grade hidden" id="grade-text"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="explain hidden" id="explain"></div>
    <button class="restart" id="restart-btn" data-i18n="restart"></button>
  </div>

</div>

<script>
  // ==========================================================
  //  언어: ko(한국어) / en(English)
  //  T(x): 현재 언어에 맞는 글을 꺼낸다
  // ==========================================================
  let lang = "ko";
  function T(x) {
    if (x === null || x === undefined) return "";
    if (Array.isArray(x) || typeof x !== "object") return x;
    return x[lang] !== undefined ? x[lang] : x.ko;
  }

  const UI = {
    reviewTitle: { ko: "정답과 해설", en: "Answers and explanations" },
    answerLabel: { ko: "정답", en: "Answer" },
    footerSrc: { ko: "출처: 변강석(2025), 『구어 중심 의사소통 상황에서 농인의 시청자화에 관한 자문화기술지』", en: "Source: Byeon Gang-seok (2025), Autoethnography on the Audience-ization of Deaf People in Spoken-Language-Centered Communication (unofficial translation)" },
    title:   { ko: "감옥 탈출 게임", en: "Prison Escape Game" },
    desc: {
      ko: "당신은 감옥에 갇혔습니다.<br>그림 속 물건을 눌러 단서를 풀고,<br>감방 → 복도 → 작업실 → 출구 순서로 이동하세요!<br><br>※ 틀려도 다음 단서로 넘어갑니다.<br>※ 문은 단서를 모두 풀어야 열립니다.<br>※ 정답은 바로 알려주지 않습니다.<br>※ 마지막에 탈출 성공 또는 탈출 실패가 나옵니다.",
      en: "You have been locked in a prison.<br>Tap the objects in the picture to solve the clues,<br>and move in order: Cell → Corridor → Workshop → Exit!<br><br>※ Even if you are wrong, you move on to the next clue.<br>※ A door opens only after you finish all of its clues.<br>※ The correct answers are not shown.<br>※ At the end, you will see Escape success or Escape failed."
    },
    start:   { ko: "탈출 시작", en: "Start escape" },
    restart: { ko: "다시 도전하기", en: "Try again" },
    next:    { ko: "계속", en: "Continue" },
    hint:    { ko: "물건을 눌러 조사하고, 문을 눌러 이동하세요.", en: "Tap objects to investigate and doors to move on." },
    submit:  { ko: "제출", en: "Submit" },
    placeholder: { ko: "정답 입력", en: "Type your answer" },
    progress:{ ko: "탈출 진행도", en: "Progress" },
    submitted: { ko: "✔ 답을 제출했습니다.", en: "✔ Answer submitted." },
    timeUp:  { ko: "⏰ 시간이 끝났습니다.", en: "⏰ Time's up." },
    afterClue: { ko: "단서를 조사했다. 다른 단서도 살펴보자.", en: "You examined the clue. Let's look for the other clues too." },
    allClues: { ko: "모든 단서를 찾았다. 이제 출구 문을 열고 나갈 차례다.", en: "You found all the clues. Now it is time to open the exit door and get out." },
    watch:   { ko: "👀 잘 보세요...", en: "👀 Watch carefully..." },
    now:     { ko: "이제 같은 순서로 누르세요!", en: "Now tap them in the same order!" },
    secs:    { ko: "초", en: "s" },
    escTitle:{ ko: "탈출 성공!", en: "Escape success!" },
    escBody: { ko: "출구 문이 활짝 열렸습니다. 자유를 얻었어요!", en: "The exit door swung wide open. You are free!" },
    failTitle:{ ko: "탈출 실패", en: "Escape failed" },
    failBody:{ ko: "문이 다시 잠기고, 감옥으로 끌려갑니다...", en: "The door locks again and you are dragged back to the cell..." }
  };

  // 화면 글씨 바꾸기 (data-i18n 이 붙은 글씨)
  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = UI[el.dataset.i18n][lang];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(el => {
      el.innerHTML = UI[el.dataset.i18nHtml][lang];
    });
    document.querySelectorAll(".langs button").forEach(b => {
      b.classList.toggle("on", b.dataset.lang === lang);
    });
  }

  // ==========================================================
  //  장면 그림 (사진)
  //  bg: 그림, size: 그림 크기, seq: 순서대로 열리는 단서
  //  exits: 다음 장면으로 가는 문 (requires 의 단서를 모두 풀어야 열림)
  // ==========================================================
  // ===== 문제 10개 (변강석(2025) 논문 기반 탈출 퀴즈) =====
  // 게임을 시작할 때마다 10문항을 무작위로 섞어 10개 칸에 배치합니다.
  const QUESTIONS = [
    { type: "ox", label: { ko: "⭕❌ OX 퀴즈", en: "⭕❌ True or False" },
      q: { ko: "농인이 회의실에 앉아 있기만 하면 대화에 동등하게 참여하고 있다고 볼 수 있다.", en: "If a Deaf person simply sits in the meeting room, they can be considered to be participating in the conversation on equal terms." },
      answer: false,
      explain: { ko: "시청자화는 한 공간에 있어도 맥락과 말차례에서 밀려나는 현상입니다.", en: "'Audience-ization' is when a Deaf person is in the same space but is pushed out of the flow of the conversation and turn-taking." },
      src: { ko: "근거: 2쪽 · 논문 92-93쪽", en: "Source: p. 2 · paper pp. 92–93" } },
    { type: "mc", label: { ko: "🔘 객관식", en: "🔘 Multiple choice" },
      q: { ko: "가족이 식탁에서 구어로만 대화해 농인 자녀가 대화를 따라가지 못합니다. 가장 가까운 개념은?", en: "At the family table, everyone talks only in spoken language, so the Deaf child cannot follow the conversation. Which concept is closest?" },
      options: { ko: ["식탁증후군", "순차통역", "수어 전환"], en: ["Dinner-table syndrome (식탁증후군)", "Consecutive interpreting", "Switching to sign language"] },
      answer: 0,
      explain: { ko: "가족 식탁에서도 구어 중심 대화는 농인 자녀를 소외시킬 수 있습니다.", en: "Even at the family table, spoken-language-centered conversation can exclude a Deaf child." },
      src: { ko: "근거: 3쪽 · 논문 93-95쪽", en: "Source: p. 3 · paper pp. 93–95" } },
    { type: "mc", label: { ko: "🔘 객관식", en: "🔘 Multiple choice" },
      q: { ko: "식탁의 구어 중심 대화에서 농인이 놓칠 수 있는 것은 무엇일까요?", en: "In spoken-language-centered dinner conversation, what might a Deaf person miss?" },
      options: { ko: ["식사 예절만", "농담·일정·우발적 학습", "음식 맛만"], en: ["Only table manners", "Jokes, schedules, and incidental learning", "Only the taste of the food"] },
      answer: 1,
      explain: { ko: "비공식 대화는 작은 지식과 사회적 정보를 자연스럽게 익히는 통로입니다.", en: "Informal conversation is a natural channel for picking up small knowledge and social information." },
      src: { ko: "근거: 3쪽 · 논문 95쪽", en: "Source: p. 3 · paper p. 95" } },
    { type: "mc", label: { ko: "🔘 객관식", en: "🔘 Multiple choice" },
      q: { ko: "농인이 질문할 준비를 했지만 통역이 늦는 사이 주제가 바뀌었습니다. 가장 필요한 것은?", en: "A Deaf person prepared a question, but the topic changed while the interpretation was delayed. What is most needed?" },
      options: { ko: ["뒤늦게 요약만 주기", "질문을 나중으로 미루기", "말차례를 멈추고 연결하기"], en: ["Giving only a summary later", "Postponing the question", "Stopping the turn-taking to reconnect the conversation"] },
      answer: 2,
      explain: { ko: "정보를 전달하는 것과 제때 발언할 기회를 보장하는 것은 다릅니다.", en: "Passing on information and guaranteeing a chance to speak at the right time are different things." },
      src: { ko: "근거: 4쪽 · 논문 111-113쪽", en: "Source: p. 4 · paper pp. 111–113" } },
    { type: "mc", label: { ko: "🔘 객관식", en: "🔘 Multiple choice" },
      q: { ko: "반복된 배제로 농인이 질문이나 발표를 스스로 포기합니다. 이 현상과 가장 가까운 것은?", en: "After repeated exclusion, a Deaf person gives up asking questions or presenting on their own. Which is closest to this phenomenon?" },
      options: { ko: ["자기검열", "언어능력 부족", "개인 선택의 문제만"], en: ["Self-censorship", "Lack of language ability", "Only a matter of personal choice"] },
      answer: 0,
      explain: { ko: "말할 조건이 부족할 때 발화 포기와 감정 억압이 나타날 수 있습니다.", en: "When the conditions for speaking are missing, people may stop speaking and suppress their emotions." },
      src: { ko: "근거: 5쪽 · 논문 107·113-114쪽", en: "Source: p. 5 · paper pp. 107, 113–114" } },
    { type: "ox", label: { ko: "⭕❌ OX 퀴즈", en: "⭕❌ True or False" },
      q: { ko: "수어통역사가 현장에 있기만 하면 농인의 발언권과 말차례는 자동으로 보장된다.", en: "As long as a sign language interpreter is present at the venue, a Deaf person's right to speak and turn-taking are automatically guaranteed." },
      answer: false,
      explain: { ko: "통역 시점·정보 맥락·참여 기회를 함께 조정해야 합니다.", en: "Interpreting timing, information context, and opportunities to participate must be adjusted together." },
      src: { ko: "근거: 6쪽 · 논문 111-115쪽", en: "Source: p. 6 · paper pp. 111–115" } },
    { type: "mc", label: { ko: "🔘 객관식", en: "🔘 Multiple choice" },
      q: { ko: "수어가 가능한 사람들이 공식 발표를 구어로만 진행합니다. 이 상황에서 점검해야 할 것은?", en: "People who can sign give official presentations only in spoken language. What should be examined in this situation?" },
      options: { ko: ["수어는 어려운 내용을 표현할 수 없다는 점", "구어를 우선하는 언어 권력과 관행", "농인의 개인별 취향"], en: ["That sign language cannot express difficult content", "The power dynamics and customs that favor spoken language", "Individual preferences of Deaf people"] },
      answer: 1,
      explain: { ko: "수어가 가능해도 선택되지 않는 구조는 농인의 주체성을 약화시킵니다.", en: "A structure where sign language is not chosen, even when it is possible, weakens Deaf people's agency." },
      src: { ko: "근거: 7쪽 · 논문 108-109쪽", en: "Source: p. 7 · paper pp. 108–109" } },
    { type: "mc", label: { ko: "🔘 객관식", en: "🔘 Multiple choice" },
      q: { ko: "농인에게 질문할 때 가장 적절한 행동은?", en: "What is the most appropriate way to ask a question to a Deaf person?" },
      options: { ko: ["통역사만 바라본다", "옆 사람에게 대신 묻는다", "농인에게 직접 시선을 향하고 말차례를 연결한다"], en: ["Look only at the interpreter", "Ask the person beside you instead", "Look directly at the Deaf person and give them a turn to speak"] },
      answer: 2,
      explain: { ko: "소통의 당사자는 농인이며 통역은 접근을 지원하는 수단입니다.", en: "The Deaf person is the main party in the communication, and interpreting is a means of supporting access." },
      src: { ko: "근거: 6·8쪽 · 논문 114-116쪽", en: "Source: pp. 6, 8 · paper pp. 114–116" } },
    { type: "ox", label: { ko: "⭕❌ OX 퀴즈", en: "⭕❌ True or False" },
      q: { ko: "농인 중심의 소통문화를 만드는 책임은 청인에게만 있다.", en: "Only hearing people are responsible for creating a communication culture centered on Deaf people." },
      answer: false,
      explain: { ko: "농사회 안에서도 구어 중심 관행이 반복될 수 있어 함께 조정할 필요가 있습니다.", en: "Spoken-language-centered customs can repeat even within the Deaf community, so everyone needs to adjust together." },
      src: { ko: "근거: 8쪽 · 논문 115-116쪽", en: "Source: p. 8 · paper pp. 115–116" } },
    { type: "mc", label: { ko: "🔘 객관식", en: "🔘 Multiple choice" },
      q: { ko: "데프 월드에서 수어를 우선 사용하는 이유로 가장 적절한 것은?", en: "Which is the most appropriate reason for prioritizing sign language in Deaf World?" },
      options: { ko: ["농인도 직접 대화의 주체로 참여하도록", "다른 언어가 언제나 열등해서", "수어를 모르는 사람을 배제하도록"], en: ["So that Deaf people can also take part directly as participants in conversation", "Because other languages are always inferior", "To exclude people who do not know sign language"] },
      answer: 0,
      explain: { ko: "중심 언어를 수어로 바꾸는 것은 동등한 참여 구조를 경험하기 위한 것입니다.", en: "Changing the central language to sign language is meant to let everyone experience a structure of equal participation." },
      src: { ko: "근거: 1·7·8쪽 · 논문 115-116쪽", en: "Source: pp. 1, 7, 8 · paper pp. 115–116" } }

          intro: { ko: "벽에 키패드와 열쇠구멍이 달린 패널이 있다. 자세히 살펴보자.", en: "A panel with a keypad and a keyhole is on the wall. Let's take a closer look." } },
        { id: "window", name: { ko: "낡은 창문", en: "Old window" }, x: 350, y: 280, w: 90, h: 70,
          intro: { ko: "낡은 창문 너머로 무언가 보인다. 자세히 살펴보자.", en: "Something can be seen beyond the old window. Let's take a closer look." } }
      ],
      exits: [
        { to: "escape", x: 235, y: 20, w: 325, h: 900, requires: ["panel", "window"] }
      ]
    }
  };

  // ===== 등급 기준: 10문항 중 7개 이상 맞히면 통과 =====
  const GRADES = [
    { min: 70, escape: true },
    { min: 0,  escape: false }
  ];

  // ===== 상태 =====
  const START_SCENE = "cell";
  let scene = START_SCENE;
  let solved = {};          // solved[장면id][물건id] = true
  let correct = 0;
  let total = 0;
  let lastMsg = null;
  let currentH = null;
  let answered = false;
  let timerId = null;
  let timeLeft = 0;
  let timeouts = [];
  let sceneW = 400, sceneH = 300;

  const $ = (id) => document.getElementById(id);
  const norm = (s) => String(s).replace(/\s/g, "").toLowerCase();

  function showScreen(name) {
    ["start-screen", "scene-screen", "quiz-screen", "result-screen"].forEach(id => {
      $(id).classList.add("hidden");
    });
    $(name).classList.remove("hidden");
  }

  function clearAll() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    timeouts.forEach(clearTimeout);
    timeouts = [];
  }

  function later(fn, ms) {
    timeouts.push(setTimeout(fn, ms));
  }

  function makeBtn(text) {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = text;
    return b;
  }

  function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  function checkInput(p, value) {
    const list = [T(p.answer), ...(T(p.accept) || [])];
    return list.some(a => norm(a) === norm(value));
  }

  function isSolved(sceneId, hid) {
    return !!(solved[sceneId] && solved[sceneId][hid]);
  }

  function countSolved() {
    let n = 0;
    Object.keys(solved).forEach(k => n += Object.keys(solved[k]).length);
    return n;
  }

  function countTotal() {
    return Object.values(SCENES).reduce((sum, s) => sum + s.hotspots.length, 0);
  }

  function setRect(el, r) {
    el.style.left = (r.x / sceneW * 100) + "%";
    el.style.top = (r.y / sceneH * 100) + "%";
    el.style.width = (r.w / sceneW * 100) + "%";
    el.style.height = (r.h / sceneH * 100) + "%";
  }

  // 창문에 들어오는 빛
  function addBeam(h) {
    const d = document.createElement("div");
    d.className = "beam";
    setRect(d, { x: h.x - 30, y: h.y, w: h.w + 60, h: (sceneH - h.y) * 0.8 });
    $("overlay").appendChild(d);
  }

  // ===== 진행 =====
  // 게임을 시작할 때마다 10문항을 무작위로 섞어 10개 칸에 하나씩 배치
  function pickQuestions() {
    const pool = shuffle(QUESTIONS);
    let i = 0;
    Object.values(SCENES).forEach(S => {
      S.hotspots.forEach(h => { h.current = pool[i++]; });
    });
  }

  function startGame() {
    scene = START_SCENE;
    solved = {};
    correct = 0;
    total = countTotal();
    pickQuestions();
    lastMsg = SCENES[START_SCENE].intro;
    showScene();
  }

  function showScene() {
    clearAll();
    const S = SCENES[scene];
    const done = countSolved();

    $("scene-name").textContent = T(S.name);
    $("scene-progress").textContent = `${T(UI.progress)} ${done} / ${total}`;
    $("bar-scene").style.width = `${(done / total) * 100}%`;
    // 장면 설명 + 다음에 조사할 단서 안내 (단서를 누르기 전에 보임)
    const seqNow = S.seq || null;
    const nextId = seqNow ? seqNow.find(id => !isSolved(scene, id)) : null;
    const nextH = nextId ? S.hotspots.find(h => h.id === nextId) : null;
    const narr = $("scene-narr");
    narr.textContent = T(lastMsg);
    if (nextH) {
      const hint = document.createElement("div");
      hint.className = "clue-hint";
      hint.textContent = T(nextH.intro);
      narr.appendChild(hint);
    }

    sceneW = S.size[0];
    sceneH = S.size[1];
    $("scene-box").style.aspectRatio = `${sceneW} / ${sceneH}`;
    const art = $("scene-art");
    art.innerHTML = "";
    const img = document.createElement("img");
    img.src = S.bg;
    img.alt = "";
    img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
    art.appendChild(img);

    const ov = $("overlay");
    ov.innerHTML = "";

    // 조사할 물건 (seq 순서대로만 열림)
    const seq = S.seq || null;
    const firstOpen = seq ? seq.find(id => !isSolved(scene, id)) : null;
    S.hotspots.forEach(h => {
      const b = document.createElement("button");
      b.className = "hs";
      setRect(b, h);
      const isDone = isSolved(scene, h.id);
      const locked = !!seq && !isDone && h.id !== firstOpen;
      if (isDone) {
        b.classList.add("done");
        b.textContent = "✅";
        b.disabled = true;
      } else if (locked) {
        b.classList.add("locked");
        b.textContent = "🔒";
        b.disabled = true;
      } else {
        b.classList.add("active");
        if (h.id === "lock" || h.id === "note") b.classList.add("sparkle");
        b.addEventListener("click", () => openHotspot(h));
      }
      if (h.id === "window" && (isDone || !locked)) addBeam(h);
      ov.appendChild(b);
    });

    // 이동할 문
    S.exits.forEach(ex => {
      const remain = ex.requires.filter(id => !isSolved(scene, id)).length;
      const locked = remain > 0;
      const b = document.createElement("button");
      b.className = "hs exit " + (locked ? "locked" : "open");
      setRect(b, ex);
      b.innerHTML = locked ? "🔒" : "🚪";
      b.disabled = locked;
      b.addEventListener("click", () => moveTo(ex.to));
      ov.appendChild(b);
    });

    showScreen("scene-screen");
  }

  function moveTo(to) {
    if (to === "escape") {
      showResult();
      return;
    }
    scene = to;
    lastMsg = SCENES[to].intro;
    showScene();
  }

  // ===== 문제 =====
  function openHotspot(h) {
    clearAll();
    currentH = h;
    answered = false;
    const p = h.current;

    $("progress-text").textContent = `${T(SCENES[scene].name)} · ${T(h.name)}`;
    $("bar-fill").style.width = `${(countSolved() / total) * 100}%`;
    $("type-label").textContent = T(p.label);
    $("question-text").textContent = T(p.q);
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("next-btn").classList.add("hidden");
    $("area").innerHTML = "";
    $("timer-text").classList.add("hidden");

    switch (p.type) {
      case "match":  renderMatch(p); break;
      case "ox":     renderOX(p); break;
      case "mc":     renderMC(p); break;
      case "input":  renderInput(p); break;
      case "order":  renderOrder(p); break;
      case "memory": renderMemory(p); break;
      case "odd":    renderOdd(p); break;
    }

    const qs = $("quiz-screen");
    qs.classList.remove("paper", "frost");
    if (h.mode) qs.classList.add(h.mode);

    showScreen("quiz-screen");
    if (p.time) startTimer(p.time);
  }

  // 답을 제출하면 정답은 보여주지 않고 "제출했다"만 표시
  function endQuestion(ok, text) {
    if (answered) return;
    answered = true;
    clearAll();
    $("timer-text").classList.add("hidden");

    document.querySelectorAll("#area button, #area input").forEach(e => e.disabled = true);

    const fb = $("feedback");
    fb.textContent = text || T(UI.submitted);
    fb.className = "feedback";

    if (ok) correct++;

    $("next-btn").classList.remove("hidden");
  }

  // 문제를 끝낸 뒤: 물건을 '조사 완료'로 표시하고 장면으로 복귀
  function afterHotspot() {
    if (!solved[scene]) solved[scene] = {};
    solved[scene][currentH.id] = true;
    // 이 장면의 단서를 모두 풀었으면 '문을 열 차례'라고 안내
    const S = SCENES[scene];
    const allDone = S.hotspots.every(h => isSolved(scene, h.id));
    lastMsg = allDone ? UI.allClues : UI.afterClue;
    showScene();
  }

  // ===== 타이머 =====
  function startTimer(sec) {
    timeLeft = sec;
    const el = $("timer-text");
    el.classList.remove("hidden");
    updateTimerText();
    timerId = setInterval(() => {
      timeLeft--;
      updateTimerText();
      if (timeLeft <= 0) {
        clearInterval(timerId);
        timerId = null;
        endQuestion(false, T(UI.timeUp));
      }
    }, 1000);
  }

  function updateTimerText() {
    const el = $("timer-text");
    el.textContent = `⏱ ${timeLeft}${T(UI.secs)}`;
    el.classList.toggle("warn", timeLeft <= 3);
  }

  // ===== 문제 유형별 =====

  // 개념 맞추기: 틀린 짝은 그 용어를 넘기고 계속 진행
  function renderMatch(p) {
    let selTerm = null;
    let resolved = 0;
    let mistakes = 0;

    const termCol = document.createElement("div");
    termCol.className = "match-col";
    const defCol = document.createElement("div");
    defCol.className = "match-col";

    const termBtns = p.pairs.map((pair, i) => {
      const b = makeBtn(T(pair.t));
      b.addEventListener("click", () => {
        if (answered || b.disabled) return;
        termBtns.forEach(x => x.classList.remove("sel"));
        selTerm = i;
        b.classList.add("sel");
      });
      termCol.appendChild(b);
      return b;
    });

    const finishOne = () => {
      resolved++;
      if (resolved === p.pairs.length) endQuestion(mistakes === 0);
    };

    shuffle(p.pairs.map((_, i) => i)).forEach(idx => {
      const b = makeBtn(T(p.pairs[idx].d));
      b.addEventListener("click", () => {
        if (answered || b.disabled || selTerm === null) return;
        const term = termBtns[selTerm];
        if (selTerm === idx) {
          term.classList.remove("sel");
          term.classList.add("done");
          term.disabled = true;
          b.classList.add("done");
          b.disabled = true;
          selTerm = null;
          finishOne();
        } else {
          mistakes++;
          term.classList.remove("sel");
          term.classList.add("done");
          term.disabled = true;
          selTerm = null;
          finishOne();
        }
      });
      defCol.appendChild(b);
    });

    const wrap = document.createElement("div");
    wrap.className = "match-wrap";
    wrap.append(termCol, defCol);
    $("area").appendChild(wrap);
  }

  // OX
  function renderOX(p) {
    const row = document.createElement("div");
    row.className = "ox-row";
    const btnO = makeBtn("⭕");
    const btnX = makeBtn("❌");
    btnO.addEventListener("click", () => { if (!answered) endQuestion(p.answer === true); });
    btnX.addEventListener("click", () => { if (!answered) endQuestion(p.answer === false); });
    row.append(btnO, btnX);
    $("area").appendChild(row);
  }

  // 객관식
  function renderMC(p) {
    const wrap = document.createElement("div");
    wrap.className = "options";
    T(p.options).forEach((t, idx) => {
      const b = makeBtn(t);
      b.addEventListener("click", () => { if (!answered) endQuestion(idx === p.answer); });
      wrap.appendChild(b);
    });
    $("area").appendChild(wrap);
  }

  // 주관식
  function renderInput(p) {
    const row = document.createElement("div");
    row.className = "input-row";
    const inp = document.createElement("input");
    inp.type = "text";
    inp.placeholder = T(UI.placeholder);
    inp.autocomplete = "off";
    const btn = document.createElement("button");
    btn.textContent = T(UI.submit);
    const submit = () => {
      if (answered) return;
      endQuestion(checkInput(p, inp.value));
    };
    btn.addEventListener("click", submit);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    row.append(inp, btn);
    $("area").appendChild(row);
    inp.focus();
  }

  // 순서 맞추기: 틀린 숫자는 무시하고 계속
  function renderOrder(p) {
    const sorted = [...p.items].sort((a, b) => a - b);
    const grid = document.createElement("div");
    grid.className = "grid";
    let step = 0;
    let mistakes = 0;

    shuffle(p.items).forEach(value => {
      const b = makeBtn(value);
      b.style.fontSize = "24px";
      b.addEventListener("click", () => {
        if (answered || b.disabled) return;
        if (value === sorted[step]) {
          b.classList.add("done");
          b.disabled = true;
          step++;
          if (step === sorted.length) endQuestion(mistakes === 0);
        } else {
          mistakes++;
        }
      });
      grid.appendChild(b);
    });
    $("area").appendChild(grid);
  }

  // 기억력 자물쇠: 틀린 색은 무시하고 계속
  function renderMemory(p) {
    const grid = document.createElement("div");
    grid.className = "grid";
    let inputPhase = false;
    let step = 0;
    let mistakes = 0;

    const btns = p.palette.map(color => {
      const b = makeBtn(color);
      b.addEventListener("click", () => {
        if (answered || !inputPhase) return;
        if (color === p.seq[step]) {
          b.classList.add("glow");
          later(() => b.classList.remove("glow"), 250);
          step++;
          if (step === p.seq.length) endQuestion(mistakes === 0);
        } else {
          mistakes++;
        }
      });
      grid.appendChild(b);
      return b;
    });
    $("area").appendChild(grid);

    // 1단계: 순서 보여주기
    btns.forEach(b => b.disabled = true);
    $("question-text").textContent = T(UI.watch);
    let t = 400;
    p.seq.forEach(color => {
      const btn = btns[p.palette.indexOf(color)];
      later(() => btn.classList.add("glow"), t);
      later(() => btn.classList.remove("glow"), t + 500);
      t += 800;
    });

    // 2단계: 직접 누르기
    later(() => {
      inputPhase = true;
      btns.forEach(b => b.disabled = false);
      $("question-text").textContent = T(UI.now);
    }, t + 200);
  }

  // 다른 하나 찾기
  function renderOdd(p) {
    const grid = document.createElement("div");
    grid.className = "grid";
    p.items.forEach((item, idx) => {
      const b = makeBtn(item);
      b.addEventListener("click", () => { if (!answered) endQuestion(idx === p.oddIndex); });
      grid.appendChild(b);
    });
    $("area").appendChild(grid);
  }

  // ===== 결과: 통과 시 정답과 해설, 불통 시 다시 도전 =====
  function renderExplain() {
    const box = $("explain");
    box.innerHTML = "";
    const title = document.createElement("h2");
    title.className = "exp-title";
    title.textContent = T(UI.reviewTitle);
    box.appendChild(title);

    let n = 1;
    Object.values(SCENES).forEach(S => {
      S.hotspots.forEach(h => {
        const p = h.current;
        const item = document.createElement("div");
        item.className = "exp-item";

        const num = document.createElement("div");
        num.className = "exp-num";
        num.textContent = String(n++).padStart(2, "0");

        const q = document.createElement("div");
        q.className = "exp-q";
        q.textContent = T(p.q);

        const ans = document.createElement("div");
        ans.className = "exp-ans";
        const correctText = p.type === "ox"
          ? (p.answer ? "⭕ O" : "❌ X")
          : T(p.options)[p.answer];
        ans.textContent = `${T(UI.answerLabel)}: ${correctText}`;

        const ex = document.createElement("div");
        ex.className = "exp-text";
        ex.textContent = T(p.explain);

        const src = document.createElement("div");
        src.className = "exp-src";
        src.textContent = T(p.src);

        item.append(num, q, ans, ex, src);
        box.appendChild(item);
      });
    });

    const foot = document.createElement("div");
    foot.className = "exp-foot";
    foot.textContent = T(UI.footerSrc);
    box.appendChild(foot);
    box.classList.remove("hidden");
  }

  function showResult() {
    clearAll();
    const percent = Math.round((correct / total) * 100);
    const g = GRADES.find(x => percent >= x.min);

    $("score-text").classList.add("hidden");
    $("grade-text").classList.add("hidden");

    if (g.escape) {
      $("result-icon").textContent = "🎉";
      $("result-msg").innerHTML =
        `<span class="escaped"><b>${T(UI.escTitle)}</b></span><br>${T(UI.escBody)}`;
      renderExplain();
    } else {
      $("result-icon").textContent = "⛓️";
      $("result-msg").innerHTML =
        `<span class="jailed"><b>${T(UI.failTitle)}</b></span><br>${T(UI.failBody)}`;
      $("explain").classList.add("hidden");
    }

    showScreen("result-screen");
  }

  // ===== 연결 =====
  document.querySelectorAll(".langs button").forEach(b => {
    b.addEventListener("click", () => { lang = b.dataset.lang; applyStatic(); });
  });
  $("start-btn").addEventListener("click", startGame);
  $("next-btn").addEventListener("click", afterHotspot);
  $("restart-btn").addEventListener("click", () => showScreen("start-screen"));
  applyStatic();
</script>

</body>
</html>
